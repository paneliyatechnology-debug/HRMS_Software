<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password • My Own HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent 40%),
        radial-gradient(circle at bottom left, rgba(20, 184, 166, 0.06), transparent 40%),
        #f8faf9;
      background-size: 100% 100%, 100% 100%, 100% 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0f172a;
    }

    .background-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#059669 0.75px, transparent 0.75px);
      background-size: 24px 24px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #059669 0%, #047857 50%, #115e59 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 16px 36px -8px rgba(5, 150, 105, 0.35);
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .brand-logo svg {
      width: 30px;
      height: 30px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    .card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px -15px rgba(5, 150, 105, 0.09), 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 12.5px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: #dc2626;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #059669;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon-left svg {
      width: 17px;
      height: 17px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 42px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: #059669;
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-toggle-pw:hover {
      color: #0f172a;
      background: #e2e8f0;
    }

    .btn-toggle-pw svg {
      width: 18px;
      height: 18px;
    }

    .field-hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      background: linear-gradient(135deg, #059669 0%, #047857 50%, #0f766e 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #047857 0%, #065f46 50%, #115e59 100%);
      box-shadow: 0 14px 30px -5px rgba(5, 150, 105, 0.45);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 6px 16px -4px rgba(5, 150, 105, 0.3);
    }

    .btn-submit svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .btn-submit:hover svg {
      transform: translateX(2px);
    }

    .card-footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
    }

    .back-link {
      font-size: 12.5px;
      font-weight: 600;
      color: #059669;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #047857;
      text-decoration: underline;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .security-badge svg {
      width: 13px;
      height: 13px;
      color: #10b981;
    }
  </style>
</head>

<body>
  <div class="background-grid"></div>

  <div class="container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
          <path d="M9 22v-4h6v4"></path>
          <path d="M8 6h.01"></path>
          <path d="M16 6h.01"></path>
          <path d="M12 6h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M12 14h.01"></path>
          <path d="M16 10h.01"></path>
          <path d="M16 14h.01"></path>
          <path d="M8 10h.01"></path>
          <path d="M8 14h.01"></path>
        </svg>
      </div>
      <h1 class="brand-title">My Own HRMS</h1>
      <p class="brand-sub">Unified Workspace • Account Security</p>
    </div>

    <div class="card">
      <h2 class="card-title">Choose a new password</h2>
      <p class="card-desc">Enter the new password you want to use for this workspace account.</p>

      <!-- ERROR_MESSAGE_PLACEHOLDER -->

      <form id="reset-password-form" method="post" action="/api/users/reset-password" enctype="multipart/form-data">
        <input type="hidden" name="token" id="token-input" value="" />

        <!-- New Password Field -->
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <div class="input-wrapper">
            <div class="input-icon-left">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input id="password" name="password" type="password" required minlength="6"
              placeholder="At least 6 characters" class="form-input" autocomplete="new-password" />
            <button type="button" id="btn-toggle-pw" class="btn-toggle-pw" title="Show password"
              aria-label="Toggle password visibility">
              <!-- Eye Off (Hidden) Icon by default -->
              <svg id="pw-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Eye (Visible) Icon hidden by default -->
              <svg id="pw-eye-on" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="field-hint">Must be at least 6 characters.</p>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <div class="input-wrapper">
            <div class="input-icon-left">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6"
              placeholder="Re-enter your new password" class="form-input" autocomplete="new-password" />
            <button type="button" id="btn-toggle-confirm" class="btn-toggle-pw" title="Show password"
              aria-label="Toggle confirm password visibility">
              <!-- Eye Off (Hidden) Icon by default -->
              <svg id="confirm-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Eye (Visible) Icon hidden by default -->
              <svg id="confirm-eye-on" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p id="match-error" style="display:none; color:#dc2626; font-size:11.5px; font-weight:600; margin-top:5px;">
            Passwords do not match.
          </p>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="btn-submit">
          <span>Save password</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="card-footer">
        <a href="/login" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Workspace Login</span>
        </a>
      </div>
    </div>

    <div class="security-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>256-Bit SSL Encrypted • Workspace Security</span>
    </div>
  </div>

  <script>
    // Extract token from URL if not already in hidden input
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const tokenInput = document.getElementById('token-input');
    if (token && tokenInput && !tokenInput.value) {
      tokenInput.value = token;
    }

    // Dynamic routing: route form action to backend URL and back-link to frontend URL
    const form = document.getElementById('reset-password-form');
    const backLink = document.querySelector('.back-link');
    if (window.location.origin.includes(':300') || window.location.protocol === 'file:') {
      if (form) form.action = 'http://192.168.1.108:4000/api/users/reset-password';
    } else if (window.location.origin.includes(':4000')) {
      if (backLink) backLink.href = 'http://192.168.1.102:3004/login';
    }

    // Blink / Toggle Visibility for New Password
    const pwInput = document.getElementById('password');
    const btnTogglePw = document.getElementById('btn-toggle-pw');
    const pwEyeOff = document.getElementById('pw-eye-off');
    const pwEyeOn = document.getElementById('pw-eye-on');

    btnTogglePw.addEventListener('click', function () {
      const isPassword = pwInput.getAttribute('type') === 'password';
      pwInput.setAttribute('type', isPassword ? 'text' : 'password');
      pwEyeOff.style.display = isPassword ? 'none' : 'block';
      pwEyeOn.style.display = isPassword ? 'block' : 'none';
      btnTogglePw.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
    });

    // Blink / Toggle Visibility for Confirm Password
    const confirmInput = document.getElementById('confirmPassword');
    const btnToggleConfirm = document.getElementById('btn-toggle-confirm');
    const confirmEyeOff = document.getElementById('confirm-eye-off');
    const confirmEyeOn = document.getElementById('confirm-eye-on');

    btnToggleConfirm.addEventListener('click', function () {
      const isPassword = confirmInput.getAttribute('type') === 'password';
      confirmInput.setAttribute('type', isPassword ? 'text' : 'password');
      confirmEyeOff.style.display = isPassword ? 'none' : 'block';
      confirmEyeOn.style.display = isPassword ? 'block' : 'none';
      btnToggleConfirm.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
    });

    // Client-side Match Validation
    const form = document.getElementById('reset-password-form');
    const matchError = document.getElementById('match-error');

    function checkMatch() {
      if (confirmInput.value && pwInput.value !== confirmInput.value) {
        matchError.style.display = 'block';
        return false;
      } else {
        matchError.style.display = 'none';
        return true;
      }
    }

    pwInput.addEventListener('input', checkMatch);
    confirmInput.addEventListener('input', checkMatch);

    form.addEventListener('submit', function (e) {
      if (!checkMatch()) {
        e.preventDefault();
        confirmInput.focus();
      }
    });
  </script>
</body>

</html>
